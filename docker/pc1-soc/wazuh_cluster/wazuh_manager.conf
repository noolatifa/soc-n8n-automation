<!-- wazuh_manager.conf — mounted to /wazuh-config-mount/etc/ossec.conf -->
<ossec_config>

  <!-- ===== Agent communication ===== -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
  </remote>

  <!-- ===== CUSTOM INTEGRATION: forward alerts (level >= 6) to n8n ===== -->
  <!-- integratord executes /var/ossec/integrations/custom-n8n.py for every
       alert with level >= 6 and passes the hook_url as argument. -->
  <integration>
    <name>custom-n8n</name>
    <hook_url>http://100.64.0.11:5678/webhook/2ca187c7-84b0-4c5e-afbb-12be832250e8</hook_url>
    <level>6</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- ===== Active Response command declarations ===== -->
  <command>
    <name>block-ip600</name>
    <executable>block-ip.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
    <timeout>600</timeout>
  </command>

  <command>
    <name>unblock-ip0</name>
    <executable>unblock-ip.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <command>
    <name>block-port600</name>
    <executable>block-port.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
    <timeout>600</timeout>
  </command>

  <command>
    <name>unblock-port0</name>
    <executable>unblock-port.sh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

</ossec_config>